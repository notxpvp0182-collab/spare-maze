name: Build Spare Maze

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Built Mod JAR to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpareMace-1.21.11
          path: build/libs/SpareMace-1.21.11.jar

      - name: Automatically Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.21.11
          name: "Spare Maze v1.21.11"
          body: "Automated build of SpareMace-1.21.11.jar for Minecraft 1.21.11 (Fabric)."
          files: build/libs/SpareMace-1.21.11.jar
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
